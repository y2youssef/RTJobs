services:
  scraper:
    build: .
    image: rtjobs-scraper
    container_name: rtjobs
    # tini as PID 1 reaps orphans and forwards `docker stop`'s SIGTERM to the
    # entrypoint's exec'd python (see docker/entrypoint.sh).
    init: true
    # Graceful stop: Chrome gets up to 15s, then runs/cycle are closed.
    stop_grace_period: 30s
    # Host networking so Chrome's CDP port (bound to loopback inside the
    # container) is reachable as localhost:9222 on the host — bridge
    # networking can't forward to a container-loopback listener.
    network_mode: host
    user: "1000:1000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      # Container default is UTC; posted_at/scraped_at are computed from
      # local time, so pin the timezone (user is UTC+3).
      - TZ=${TZ:-Africa/Cairo}
      - HEADLESS=false
      - DATA_DIR=/data
      # Scraper runs are one-shot (docker logs vanish with `docker start`
      # cycles); keep full run logs in the volume next to the workers'.
      - LOG_FILE=/data/logs/scraper.log
      - KILL_CHROME_ON_START=true
      # Same value drives ofelia's cron below (set it in .env; must divide 60).
      # Compose substitutes it at `up` time into BOTH this entry (which wins
      # over env_file) and the cron label, so they cannot disagree; after a
      # change, `docker compose up -d` recreates the scraper and the scheduler.
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-3}
    volumes:
      - chrome_profile:/app/chromeprofile
      - wuzzuf_profile:/app/wuzzufprofile
      - indeed_profile:/app/indeedprofile
      - scraper_data:/data
      - ./markup:/data/markup
    # --scheduled: a cycle that overruns a tick starts the next one at once.
    command: ["/app/docker/entrypoint.sh", "python", "main.py", "--scheduled"]
    restart: "no"

  scheduler:
    # Pinned to 0.3.22 (latest is 0.3.x line; 0.4.x drops leading-seconds cron
    # and would silently break the "0 */6 * * * *" schedule — see AGENTS.md #7).
    # Digest for amd64: sha256:0aeec97f549d3cae77cd5a926001d5beeac3aa91e69363f9db1e85851c091328
    image: mcuadros/ofelia:0.3.22
    container_name: ofelia
    depends_on:
      - scraper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    command: daemon --docker
    # job-run labels MUST be on the ofelia container itself (docs: only
    # job-exec may be defined on a target container). Seconds-first cron.
    # no-overlap: ofelia watches the container until it exits, so a tick that
    # lands mid-run is skipped cleanly (main.py then chains the next cycle).
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.scraper.schedule: "0 */${SCRAPE_INTERVAL_MINUTES:-3} * * * *"
      ofelia.job-run.scraper.no-overlap: "true"
      ofelia.job-run.scraper.container: "rtjobs"
      ofelia.job-run.scraper.delete: "false"

  enrichment:
    # Browser-free pipeline services share SQLite, each with its own process lock.
    # Start with: docker compose --profile enrichment up -d --build
    profiles: ["enrichment"]
    build: .
    image: rtjobs-scraper
    init: true
    user: "1000:1000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Africa/Cairo}
      - DATA_DIR=/data
      - LOG_FILE=/data/logs/enrichment.log
    volumes:
      - scraper_data:/data
      - ./markup:/data/markup:ro
    command: ["python", "-m", "core.enrichment_worker"]
    stop_grace_period: 360s
    restart: unless-stopped

  delivery:
    # Browser-free pipeline services share SQLite, each with its own process lock.
    # Start with: docker compose --profile enrichment up -d --build
    profiles: ["enrichment"]
    build: .
    image: rtjobs-scraper
    init: true
    user: "1000:1000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Africa/Cairo}
      - DATA_DIR=/data
      - LOG_FILE=/data/logs/delivery.log
    volumes:
      - scraper_data:/data
      - ./markup:/data/markup:ro
    command: ["python", "-m", "core.delivery_worker"]
    stop_grace_period: 120s
    restart: unless-stopped

  monitor:
    # Browser-free pipeline services share SQLite, each with its own process lock.
    # Start with: docker compose --profile enrichment up -d --build
    profiles: ["enrichment"]
    build: .
    image: rtjobs-scraper
    init: true
    user: "1000:1000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Africa/Cairo}
      - DATA_DIR=/data
      - LOG_FILE=/data/logs/monitor.log
    volumes:
      - scraper_data:/data
      - ./markup:/data/markup:ro
    command: ["python", "-m", "core.pipeline_monitor"]
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  chrome_profile:
  wuzzuf_profile:
  indeed_profile:
  scraper_data:
